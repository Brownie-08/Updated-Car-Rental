<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Debug Test</title>
    <style>
        .chat-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #007bff;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
        }
        
        .chat-widget-modal {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 400px;
            height: 500px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            z-index: 999;
            display: none;
        }
        
        .chat-widget-modal.active {
            display: block;
        }
        
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .chat-input {
            padding: 10px;
        }
        
        .chat-input input {
            width: 70%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .chat-input button {
            width: 25%;
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <h1>Chat Test Page</h1>
    
    <!-- Chat Toggle Button -->
    <button id="chat-toggle-btn" class="chat-toggle-btn">💬</button>
    
    <!-- Chat Modal -->
    <div id="chat-widget-modal" class="chat-widget-modal">
        <div class="chat-header">
            <h5>Test Chat</h5>
            <button id="chat-close-btn">✕</button>
        </div>
        
        <div id="chat-widget">
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will appear here -->
            </div>
            
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Simple test script
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('chat-toggle-btn');
            const modal = document.getElementById('chat-widget-modal');
            const closeBtn = document.getElementById('chat-close-btn');
            const sendBtn = document.getElementById('send-btn');
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            
            let isOpen = false;
            
            function toggleChat() {
                isOpen = !isOpen;
                console.log('Toggle chat:', isOpen);
                modal.classList.toggle('active', isOpen);
            }
            
            function addMessage(sender, text) {
                const messageDiv = document.createElement('div');
                messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
                messageDiv.style.marginBottom = '10px';
                messages.appendChild(messageDiv);
                messages.scrollTop = messages.scrollHeight;
            }
            
            function sendMessage() {
                const text = input.value.trim();
                if (!text) return;
                
                console.log('Sending message:', text);
                addMessage('You', text);
                input.value = '';
                
                // Test API call
                testAPICall(text);
            }
            
            async function testAPICall(message) {
                try {
                    console.log('Testing API call...');
                    
                    // First, create session
                    const sessionResponse = await fetch('/api/ai-chat/session/create/');
                    const sessionData = await sessionResponse.json();
                    console.log('Session response:', sessionData);
                    
                    if (sessionData.success) {
                        // Send message
                        const messageResponse = await fetch('/api/ai-chat/message/send/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                session_id: sessionData.session_id,
                                message: message
                            })
                        });
                        
                        const messageData = await messageResponse.json();
                        console.log('Message response:', messageData);
                        
                        if (messageData.success && messageData.response.text) {
                            addMessage('Bot', messageData.response.text);
                        } else {
                            addMessage('System', 'Error: ' + (messageData.message || 'Failed to get response'));
                        }
                    } else {
                        addMessage('System', 'Error: Failed to create session');
                    }
                    
                } catch (error) {
                    console.error('API Error:', error);
                    addMessage('System', 'Connection error: ' + error.message);
                }
            }
            
            // Event listeners
            toggleBtn.addEventListener('click', toggleChat);
            closeBtn.addEventListener('click', toggleChat);
            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            console.log('Debug chat initialized');
        });
    </script>
</body>
</html>
